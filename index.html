<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meld Cast Receiver</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  @font-face {
    font-family: 'TRT Structa Pro';
    src: url('./TRTStructaPro-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'TRT Structa Pro';
    src: url('./TRTStructaPro-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #fff;
    font-family: 'TRT Structa Pro', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #bg {
    position: fixed; inset: -60px;
    background-size: cover;
    background-position: center;
    filter: blur(35px) saturate(1.4) brightness(0.55);
    transform: translate3d(0, 0, 0) scale(1.15);
    will-change: transform;
    contain: strict;
    transition: background-image 0.6s ease;
    z-index: 10;
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 100%);
  }

  #stage {
    position: relative;
    z-index: 20;
    display: flex;
    height: 100%;
    padding: 5vh 2vw 5vh 5vw;
    gap: 3.5vw;
    align-items: center;
  }

  #left {
    flex: 0 0 29%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2vh;
  }

  #art {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    object-fit: cover;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55);
    background: #111;
  }

  #meta { width: 100%; }
  #title {
    font-size: 2.1vw;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #artist {
    margin-top: 0.6vh;
    font-size: 1.3vw;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
  }

  #progressWrap {
    width: 100%;
    margin-top: 1.5vh;
  }
  #progressBarBg {
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
  }
  #progressBarFill {
    height: 100%;
    width: 0%;
    background: #fff;
    border-radius: 3px;
    transition: width 0.25s linear;
  }
  #timeRow {
    display: flex;
    justify-content: space-between;
    margin-top: 0.6vh;
    font-size: 0.9vw;
    color: rgba(255,255,255,0.55);
    font-variant-numeric: tabular-nums;
  }

  #status {
    margin-top: 1vh;
    font-size: 1vw;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.03em;
  }

  /* Lyrics */
  #lyricsWrap {
    flex: 1;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #lyrics {
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }
  .line {
    font-family: 'TRT Structa Pro', sans-serif;
    font-size: 2.7vw;
    font-weight: 400;
    line-height: 1.35;
    padding: 1.4vh 5.5vw 1.4vh 1.8vw;
    color: rgba(255,255,255,0.35);
    transform-origin: 1.8vw center;
    overflow-wrap: break-word;
    word-break: break-word;
    box-sizing: border-box;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease, color 0.35s ease;
    will-change: transform, opacity;
  }
  .line.active {
    font-family: 'TRT Structa Pro', sans-serif;
    font-size: 3.3vw;
    font-weight: 700;
    color: #fff;
    transform: scale(1.03);
    opacity: 1 !important;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
  }
  .line.dist-1 {
    opacity: 0.65;
  }
  .line.dist-2 {
    opacity: 0.40;
  }
  .line.dist-3 {
    opacity: 0.20;
  }
  .line.dist-4 {
    opacity: 0.10;
  }
  .line.dist-5 {
    opacity: 0.04;
  }
  .line.hidden-line {
    opacity: 0 !important;
    visibility: hidden !important;
  }
  /* word-level highlight support (used when karaoke data is available) */
  .word { transition: color 0.15s linear; }
  .word.sung { color: #fff; }
  .word.unsung { color: rgba(255,255,255,0.32); }

  #emptyLyrics {
    font-size: 1.6vw;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
  }

</style>
</head>
<body>
  <div id="bg"></div>
  <div id="stage">
    <div id="left">
      <img id="art" src="" alt="">
      <div id="meta">
        <div id="title">In attesa di riproduzione…</div>
        <div id="artist"></div>
        <div id="progressWrap">
          <div id="progressBarBg"><div id="progressBarFill"></div></div>
          <div id="timeRow"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>
        </div>
        <div id="status"></div>
      </div>
    </div>
    <div id="lyricsWrap">
      <div id="lyrics"><div id="emptyLyrics">Nessun testo disponibile</div></div>
    </div>
  </div>

<script>
window.onerror = function(msg, url, line, col, err) {
  console.error('Global receiver error:', msg, url, line, err);
  return false;
};
window.onunhandledrejection = function(e) {
  console.error('Unhandled rejection in receiver:', e.reason);
};
/* ============================================================
   MELD CAST RECEIVER
   Custom CAF (Cast Application Framework) web receiver.
   Fetches synced lyrics client-side using title/artist metadata
   that Google Cast already delivers with every LOAD request —
   no changes needed on the Meld Android app for this to work,
   beyond pointing the sender at this receiver's App ID.

   Lyrics sources, in order of preference:
     1. AMLL TTML DB  -> word-level ("karaoke") sync, when a
        match exists for the track (community-maintained, free,
        no auth: https://github.com/Steve-xmh/amll-ttml-db)
     2. LRCLIB         -> line-level sync, much larger coverage
        (https://lrclib.net, free, no auth)

   NOTE: this file has not been validated on real Cast hardware.
   The CAF Receiver SDK event/field names below match the public
   docs as of writing, but Google's SDK does change field shapes
   between versions — test on your actual device/TV and expect to
   fix small field-name mismatches (see TODO markers).
   ============================================================ */

const context = cast.framework.CastReceiverContext.getInstance();
const playerManager = context.getPlayerManager();

let lyricsLines = [];       // [{time: seconds, text: string, words?: [{time, text}]}]
let lyricsMode = 'none';    // 'word' | 'line' | 'none'
let activeLineIndex = -1;
let lastFetchKey = '';

/* ---------- UI helpers ---------- */

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function updateNowPlayingUI(mediaInfo) {
  if (!mediaInfo) return;
  const meta = mediaInfo.metadata || {};
  const custom = mediaInfo.customData || {};
  const title = meta.title || custom.title || meta.songName || '';
  const artist = meta.artist || custom.artist || meta.subtitle || (meta.artists && meta.artists.join(', ')) || '';

  document.getElementById('title').textContent = title || 'In riproduzione';
  document.getElementById('artist').textContent = artist;

  const images = meta.images;
  if (images && images.length) {
    const url = images[0].url;
    document.getElementById('art').src = url;
    document.getElementById('bg').style.backgroundImage = `url("${url}")`;
  }

  const key = `${title}__${artist}`;
  if (key !== lastFetchKey) {
    lastFetchKey = key;
    if (title) fetchLyrics(title, artist);
  }
}

function updateProgressUI(currentSec, durationSec) {
  const pct = durationSec > 0 ? Math.min(100, (currentSec / durationSec) * 100) : 0;
  document.getElementById('progressBarFill').style.width = pct + '%';
  document.getElementById('timeCur').textContent = fmtTime(currentSec);
  document.getElementById('timeDur').textContent = fmtTime(durationSec);
  updateLyricsHighlight(currentSec);
}

/* ---------- Lyrics rendering ---------- */

function renderLyrics() {
  const container = document.getElementById('lyrics');
  if (!lyricsLines.length) {
    container.innerHTML = '<div id="emptyLyrics">Nessun testo disponibile</div>';
    return;
  }
  container.innerHTML = lyricsLines.map((line, i) => {
    if (lyricsMode === 'word' && line.words && line.words.length) {
      const spans = line.words.map(w =>
        `<span class="word" data-t="${w.time}">${escapeHtml(w.text)} </span>`
      ).join('');
      return `<div class="line" id="line-${i}" data-t="${line.time}">${spans}</div>`;
    }
    return `<div class="line" id="line-${i}" data-t="${line.time}">${escapeHtml(line.text)}</div>`;
  }).join('');
  activeLineIndex = -1;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function updateLyricsHighlight(currentSec) {
  if (!lyricsLines.length) return;

  // find current active line
  let idx = -1;
  for (let i = 0; i < lyricsLines.length; i++) {
    if (lyricsLines[i].time <= currentSec) {
      idx = i;
    } else {
      break;
    }
  }

  // If before the first line starts, point to line 0
  if (idx < 0) idx = 0;

  if (idx !== activeLineIndex) {
    activeLineIndex = idx;

    // Apply distance classes: active line, 5 backwards, and 5 forward
    const total = lyricsLines.length;
    for (let i = 0; i < total; i++) {
      const el = document.getElementById(`line-${i}`);
      if (!el) continue;

      const dist = Math.abs(i - idx);
      el.className = 'line';

      if (dist === 0) {
        el.classList.add('active');
      } else if (dist <= 5) {
        el.classList.add(`dist-${dist}`);
      } else {
        el.classList.add('hidden-line');
      }
    }

    // Center active line in the viewport using translate3d
    const activeEl = document.getElementById(`line-${idx}`);
    const wrap = document.getElementById('lyricsWrap');
    const lyricsEl = document.getElementById('lyrics');
    if (activeEl && wrap && lyricsEl) {
      const activeCenter = activeEl.offsetTop + (activeEl.offsetHeight / 2);
      const wrapCenter = wrap.clientHeight / 2;
      const targetTranslate = wrapCenter - activeCenter;
      lyricsEl.style.transform = `translate3d(0, ${targetTranslate}px, 0)`;
    }
  }

  // word-level highlight within the active line, if available
  if (lyricsMode === 'word' && idx >= 0 && lyricsLines[idx].words) {
    const el = document.getElementById(`line-${idx}`);
    if (el) {
      const spans = el.querySelectorAll('.word');
      spans.forEach(s => {
        const t = parseFloat(s.dataset.t);
        s.classList.toggle('sung', t <= currentSec);
        s.classList.toggle('unsung', t > currentSec);
      });
    }
  }
}

/* ---------- Lyrics fetching ---------- */

async function fetchLyrics(title, artist) {
  lyricsLines = [];
  lyricsMode = 'none';
  renderLyrics();
  setStatus('Ricerca testo…');

  // 1. Try AMLL TTML DB for word-level sync (best-effort; DB is ID-indexed,
  //    so this relies on their search surface finding a title/artist match).
  //    TODO: confirm exact search endpoint/shape — see amll-ttml-db repo.
  try {
    const ttml = await tryAmllTtmlDb(title, artist);
    if (ttml) {
      lyricsLines = ttml;
      lyricsMode = 'word';
      renderLyrics();
      setStatus('Testo sincronizzato (parola per parola)');
      return;
    }
  } catch (e) {
    console.log('AMLL TTML DB lookup failed, falling back to LRCLIB', e);
  }

  // 2. Fall back to LRCLIB (line-synced, much larger coverage)
  try {
    const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1500);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (res.ok) {
      const data = await res.json();
      if (data.syncedLyrics) {
        lyricsLines = parseLRC(data.syncedLyrics);
        lyricsMode = 'line';
        renderLyrics();
        setStatus('Testo sincronizzato');
        return;
      }
      if (data.plainLyrics) {
        // unsynced fallback: show as a single static block, no highlight
        lyricsLines = [{ time: 0, text: data.plainLyrics }];
        lyricsMode = 'none';
        renderLyrics();
        setStatus('Testo non sincronizzato');
        return;
      }
    }
  } catch (e) {
    console.log('LRCLIB lookup failed', e);
  }

  setStatus('');
  renderLyrics();
}

function parseLRC(lrc) {
  const out = [];
  const timeTag = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
  for (const rawLine of lrc.split('\n')) {
    const matches = [...rawLine.matchAll(timeTag)];
    if (!matches.length) continue;
    const text = rawLine.replace(timeTag, '').trim();
    for (const m of matches) {
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
      out.push({ time: min * 60 + sec + ms / 1000, text });
    }
  }
  out.sort((a, b) => a.time - b.time);
  return out;
}

// Placeholder — wire up once the AMLL TTML DB search endpoint is confirmed.
// Returns null (no match) until implemented, so the LRCLIB fallback always
// keeps things working in the meantime.
async function tryAmllTtmlDb(title, artist) {
  return null;
}

/* ---------- Cast Receiver SDK wiring ---------- */

// 1. Intercept the LOAD command immediately when the phone commands playback
playerManager.setMessageInterceptor(
  cast.framework.messages.MessageType.LOAD,
  loadRequestData => {
    try {
      console.log('LOAD message intercepted:', loadRequestData);
      if (loadRequestData && loadRequestData.media) {
        updateNowPlayingUI(loadRequestData.media);
        const customDur = loadRequestData.media.customData && (loadRequestData.media.customData.duration || (loadRequestData.media.customData.durationMs / 1000));
        const mediaDur = loadRequestData.media.duration;
        const duration = mediaDur || customDur || 0;
        updateProgressUI(0, duration);
        setStatus('Caricamento…');
      }
    } catch (err) {
      console.error('Error in LOAD interceptor:', err);
    }
    return loadRequestData;
  }
);

// 2. Metadata status updates
playerManager.addEventListener(
  cast.framework.events.EventType.MEDIA_STATUS,
  () => {
    const info = playerManager.getMediaInformation();
    if (info) updateNowPlayingUI(info);
  }
);

// 3. Playback progress and lyrics synchronization
playerManager.addEventListener(
  cast.framework.events.EventType.TIME_UPDATE,
  (event) => {
    const info = playerManager.getMediaInformation();
    const duration = (info && info.duration) || 
                     (info && info.customData && (info.customData.duration || (info.customData.durationMs / 1000))) || 
                     (playerManager.getDuration ? playerManager.getDuration() : 0);
    updateProgressUI(event.currentMediaTime || 0, duration);
  }
);

// High frequency ticker (100ms) for smooth lyrics sync without waiting for 1s TIME_UPDATE
let playbackTicker = null;
function startPlaybackTicker() {
  if (playbackTicker) return;
  playbackTicker = setInterval(() => {
    if (!playerManager) return;
    const curTime = playerManager.getCurrentTimeSec();
    const info = playerManager.getMediaInformation();
    const customDur = info && info.customData && (info.customData.duration || (info.customData.durationMs / 1000));
    const duration = (info && info.duration) || customDur || (playerManager.getDuration ? playerManager.getDuration() : 0);
    if (curTime >= 0) {
      updateProgressUI(curTime, duration);
    }
  }, 100);
}

function stopPlaybackTicker() {
  if (playbackTicker) {
    clearInterval(playbackTicker);
    playbackTicker = null;
  }
}

// 4. Playback events
playerManager.addEventListener(
  cast.framework.events.EventType.PLAYING,
  () => {
    setStatus('');
    startPlaybackTicker();
  }
);

playerManager.addEventListener(
  cast.framework.events.EventType.PAUSE,
  () => {
    stopPlaybackTicker();
  }
);

// 5. Error diagnostics
playerManager.addEventListener(
  cast.framework.events.EventType.ERROR,
  (event) => {
    console.error('CAF Player Error:', event);
    const code = event.detailedErrorCode || event.reason || 'Errore';
    setStatus('Errore riproduzione (' + code + ')');
    stopPlaybackTicker();
  }
);

const options = new cast.framework.CastReceiverOptions();
options.disableIdleTimeout = true; // keep the receiver visible between tracks
context.start(options);
</script>
</body>
</html>
